    value: '{{empresa_documento}}'
    type: query
    disabled: true
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: Listar empresas. Filtro opcional por CNPJ/CPF.
