info:
  name: Token
  type: http
  seq: 1
http:
  method: POST
  url: '{{base_url_auth}}/Token'
  headers:
    - name: Content-Type
      value: application/x-www-form-urlencoded
    - name: Accept
      value: application/json
  body:
    type: form-urlencoded
    data:
      - name: grant_type
        value: password
      - name: username
        value: '{{username}}'
      - name: password
        value: '{{password}}'
      - name: client_id
        value: '3'
runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status 200", function () {
          expect(res.status).to.equal(200);
        });

        if (res.body && res.body.access_token) {
          const token = String(res.body.access_token);
          if (bru.getEnvName()) {
            bru.setEnvVar("access_token", token);
          } else {
            bru.setVar("access_token", token);
          }
        }
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: >-
  Obtém o `access_token` via `grant_type=password`.
  O script pós-resposta salva automaticamente em `access_token` (no environment ativo, ou em variável de sessão se nenhum environment estiver selecionado).
