info:
  name: Listar Bancos
  type: http
  seq: 3
http:
  method: GET
  url: '{{base_url_auth}}/ContasSecullumExterno/ListarBancos'
  headers:
    - name: Accept
      value: application/json
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status 200", function () {
          expect(res.status).to.equal(200);
        });

        if (Array.isArray(res.body) && res.body.length > 0) {
          console.log("Bancos disponíveis (" + res.body.length + "):");
          res.body.forEach((b, idx) => {
            console.log(`  [${idx}] id=${b.id} | identificador=${b.identificador || "-"} | nome=${b.nome || "-"}`);
          });

          const hasEnv = Boolean(bru.getEnvName());
          const currentBankId = hasEnv ? bru.getEnvVar("selected_bank_id") : bru.getVar("selected_bank_id");

          if (currentBankId) {
            console.log(`Banco atual mantido: selected_bank_id=${currentBankId}. Para trocar, altere no Environment.`);
          } else {
            const first = res.body[0];
            const saveVar = (key, val) => {
              if (hasEnv) {
                bru.setEnvVar(key, val);
              } else {
                bru.setVar(key, val);
              }
            };

            if (first.id !== undefined && first.id !== null) {
              saveVar("selected_bank_id", String(first.id));
            }
            if (first.identificador) {
              saveVar("selected_bank_identificador", String(first.identificador).replace(/[^a-zA-Z0-9]/g, ""));
            }
            if (first.nome) {
              saveVar("selected_bank_name", String(first.nome));
            }
          }
        }
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: >-
  Lista os bancos disponíveis para o token atual e imprime todos no Console do Bruno.
  Se `selected_bank_id` ainda estiver vazio, preenche automaticamente com o primeiro banco no Environment ativo.
  Se você já escolheu outro `selected_bank_id` no Environment, o script preserva a sua escolha.
