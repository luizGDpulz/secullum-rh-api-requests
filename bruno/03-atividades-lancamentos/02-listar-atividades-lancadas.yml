info:
  name: Listar atividades lançadas
  type: http
  seq: 2
http:
  method: GET
  url: '{{base_url_api}}/IntegracaoExterna/AtividadesLancamentos?DataInicio={{data_inicio}}'
  headers:
  - name: Accept
    value: application/json
  - name: secullumidbancoselecionado
    value: '{{selected_bank_id}}'
  params:
  - name: FuncionarioPis
    value: '{{funcionario_pis}}'
    type: query
    disabled: true
  - name: FuncionarioCpf
    value: '{{funcionario_cpf}}'
    type: query
    disabled: true
  - name: AtividadeDescricao
    value: '{{atividade_descricao}}'
    type: query
    disabled: true
  - name: DataInicio
    value: '{{data_inicio}}'
    type: query
  - name: DataFim
    value: '{{data_fim}}'
    type: query
    disabled: true
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: 'Lista lançamentos de atividades. Observação: o PDF mostra `HoraInicio`/`HoraFim` no exemplo, mas o swagger atual expõe
  apenas `FuncionarioPis`, `FuncionarioCpf`, `AtividadeDescricao`, `DataInicio` e `DataFim` neste GET.'
