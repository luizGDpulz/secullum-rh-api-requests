info:
  name: Listar atividades
  type: http
  seq: 2
http:
  method: GET
  url: '{{base_url_api}}/IntegracaoExterna/Atividades'
  headers:
  - name: Accept
    value: application/json
  - name: secullumidbancoselecionado
    value: '{{selected_bank_id}}'
  params:
  - name: descricao
    value: '{{descricao}}'
    type: query
    disabled: true
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: Listar atividades cadastradas. Filtro opcional por descrição.
